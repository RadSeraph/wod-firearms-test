name: Release Creation
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update module.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          jq --arg v "$VERSION" '.version = $v' module.json > tmp.json && mv tmp.json module.json
          jq --arg url "https://github.com/${{ github.repository }}/releases/download/$VERSION/module.zip" '.download = $url' module.json > tmp.json && mv tmp.json module.json
          jq --arg url "https://github.com/${{ github.repository }}/releases/latest/download/module.json" '.manifest = $url' module.json > tmp.json && mv tmp.json module.json
      - name: Zip files
        run: zip -r module.zip module.json scripts styles templates lang
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.zip
            module.json
